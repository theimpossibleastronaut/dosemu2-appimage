name: Build dosemu2 AppImage

# Builds the AppImage from a *deliberately chosen* dosemu2 commit, never
# automatically: dosemu2's devel branch moves constantly and a rebuild per
# push would republish "latest" with untested upstream code. Dispatch this
# workflow with the ref you want.
#
# Pushes and PRs build and smoke-test against the sha in the DOSEMU2_REF
# file and publish nothing, so a broken build script is caught. That file
# is also how a contributor proposes a newer dosemu2: edit it, open a PR,
# and CI builds and smoke-tests both arches against the proposed sha.
# Merging it does not release anything — publishing is still a dispatch.

on:
  workflow_dispatch:
    inputs:
      dosemu2_ref:
        description: 'dosemu2 commit, tag or branch to build'
        required: true
        type: string
      publish:
        description: 'Publish to the "latest" release'
        required: false
        default: true
        type: boolean
  push:
    branches: [trunk]
    paths: &p
      - 'DOSEMU2_REF'
      - 'build-appimage.sh'
      - 'dosemu2.desktop'
      - 'dosemu.png'
      - 'docker/Dockerfile-appimage'
      - '.github/workflows/appimage.yml'
  pull_request:
    branches: [trunk]
    paths: *p

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BUILD_IMAGE: ghcr.io/theimpossibleastronaut/dosemu2-appimage-build-env:latest

jobs:
  build:
    # Without an explicit name the job label carries the whole base-image
    # digest and is unreadable in the Actions sidebar.
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            base: archlinux:latest
          # Official Arch is x86_64-only. Keep this digest in step with
          # appimage-build-image.yml, which builds the published image.
          - os: ubuntu-24.04-arm
            arch: arm64
            base: lopsided/archlinux@sha256:63c8d3c53f643ff81241058f30f26b1fc5debea807c1b326e3f85814eac87d37
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the Dockerfile-changed check below can diff
          # against the event's base commit. This repo is build glue, so
          # the clone is cheap.
          fetch-depth: 0

      - name: Resolve dosemu2 ref
        env:
          INPUT_REF: ${{ inputs.dosemu2_ref }}
        run: |
          set -eu
          ref="${INPUT_REF:-$(tr -d '[:space:]' < DOSEMU2_REF)}"
          # A ref reaches git and a docker -e flag, so keep it to the
          # characters a git ref can legally contain.
          case "$ref" in
            *[!A-Za-z0-9._/-]*)
              echo "Refusing suspicious dosemu2 ref: $ref" >&2; exit 1 ;;
          esac
          echo "DOSEMU2_REF=$ref" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get build environment
        # Builds the image here rather than pulling when this event's own
        # diff changes the Dockerfile: appimage-build-image.yml runs on the
        # same push and takes about half an hour, so the registry is still
        # serving the previous image while this job needs the new one.
        # Pulling anyway produced a build against an image missing the
        # packages the same commit had just added. Also builds when the
        # pull fails outright, which is the case before the image has ever
        # been published.
        env:
          BASE: ${{ matrix.base }}
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          set -eu
          changed=no
          if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" "$GITHUB_SHA" \
              | grep -qx 'docker/Dockerfile-appimage' && changed=yes || :
          fi
          if [ "$changed" = yes ]; then
            echo "Dockerfile changed in this event; building the image here."
            docker build --build-arg "BASE=$BASE" \
              -f docker/Dockerfile-appimage -t "$BUILD_IMAGE" .
          else
            docker pull "$BUILD_IMAGE" ||
              docker build --build-arg "BASE=$BASE" \
                -f docker/Dockerfile-appimage -t "$BUILD_IMAGE" .
          fi

      - name: Build AppImage
        # Runs as root inside the container: build-appimage.sh installs
        # dosemu2 into the container's own /usr before bundling from it.
        run: |
          docker run --rm -u 0 \
            -v "$GITHUB_WORKSPACE":/workspace -w /workspace \
            -e DOSEMU2_REF -e WORKSPACE=/workspace \
            "$BUILD_IMAGE" sh -c './build-appimage.sh'
          sudo chown -R "$(id -u):$(id -g)" out

      - name: Resolve version + arch
        run: |
          echo "ARCH=$(uname -m)" >> "$GITHUB_ENV"
          echo "VERSION=$(cat out/DOSEMU2_VERSION)" >> "$GITHUB_ENV"
          echo "DOSEMU2_COMMIT=$(cat out/DOSEMU2_COMMIT)" >> "$GITHUB_ENV"

      - name: Smoke test
        # Boots FreeDOS (fdpp) under the terminal video plugin and runs a
        # DOS command, which exercises the parts most likely to break in a
        # bundle: fdpp's kernel, comcom64/dj64's crt0, and dosemu2's own
        # data dirs. --appimage-extract-and-run because GitHub runners
        # have no FUSE.
        run: |
          cd out
          chmod +x ./dosemu2-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./dosemu2-*.AppImage \
            -td -ks -E "ver" 2>&1 | tee smoke.log
          grep -qi comcom smoke.log
          ! grep -q "FDPP boot failed" smoke.log
          rm -f smoke.log

      - name: Generate sha256sum
        run: |
          cd out
          file=$(ls *.AppImage)
          sha256sum "$file" > "$file.sha256sum"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: dosemu2-AppImage-${{ env.ARCH }}
          path: ./out/*
          if-no-files-found: error

  publish:
    needs: build
    # Dispatch only. Pushes and PRs build and smoke-test, so a broken
    # build script is caught, but publishing "latest" stays a deliberate
    # act with a chosen dosemu2 commit behind it.
    if: github.event_name == 'workflow_dispatch' && inputs.publish != false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both arches
        uses: actions/download-artifact@v8
        with:
          path: out
          pattern: dosemu2-AppImage-*
          merge-multiple: true

      - name: Resolve version
        run: |
          echo "VERSION=$(cat out/DOSEMU2_VERSION)" >> "$GITHUB_ENV"
          echo "DOSEMU2_COMMIT=$(cat out/DOSEMU2_COMMIT)" >> "$GITHUB_ENV"
          # A rebuild at an unchanged dosemu2 commit produces a different
          # bundle under an identical version string, so without this the
          # release page looks untouched when it is not. The time is in
          # there because two rebuilds in one day is a normal thing to do.
          echo "BUILD_DATE=$(date -u '+%Y%m%d_%H%M')" >> "$GITHUB_ENV"
          # Same shortening build-appimage.sh applies to the asset names,
          # so the archive tag reads like the files under it.
          echo "VERSION_SHORT=$(sed -E 's/-[0-9]{8}-[0-9]+-g/-g/' out/DOSEMU2_VERSION)" \
            >> "$GITHUB_ENV"

      # Before the rolling release, so "latest" ends up on that one.
      - name: Archive this build under its own tag
        uses: ncipollo/release-action@v1
        with:
          # "latest" keeps exactly one build's assets, which is what makes
          # `head -1` safe for the installers that pick an asset by
          # position. This is where the previous builds stay reachable.
          tag: ${{ env.VERSION_SHORT }}
          name: ${{ env.VERSION_SHORT }}
          artifacts: "./out/*AppImage*"
          body: |
            Archived build of [dosemu2](https://github.com/dosemu2/dosemu2)
            at commit
            [`${{ env.DOSEMU2_COMMIT }}`](https://github.com/dosemu2/dosemu2/commit/${{ env.DOSEMU2_COMMIT }}).

            The current build is on the
            [`latest`](../../releases/latest) release. These AppImages do
            not update themselves to this tag: their built-in update URL
            resolves to whatever is marked latest.
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: false
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          # A single rolling release, always tagged "latest" — the
          # AppImage's baked-in zsync update URL resolves against
          # whatever GitHub marks as the latest release, and installers
          # that scrape /releases (An/AM's catalog entry, for one) take
          # the newest asset with no prerelease filter. One stream keeps
          # both of those pointing at the build that was actually tested.
          tag: latest
          name: ${{ env.VERSION_SHORT }}-${{ env.BUILD_DATE }}
          artifacts: "./out/*AppImage*"
          body: |
            AppImage of [dosemu2](https://github.com/dosemu2/dosemu2),
            built from source at commit
            [`${{ env.DOSEMU2_COMMIT }}`](https://github.com/dosemu2/dosemu2/commit/${{ env.DOSEMU2_COMMIT }})
            (`${{ env.VERSION }}`).

            Runs on any Linux distribution, glibc or musl: the AppImage
            bundles its own C library and dynamic loader
            ([AnyLinux](https://github.com/pkgforge-dev/Anylinux-AppImages)).

            ## Usage

            ```
            chmod +x dosemu2-*.AppImage
            ./dosemu2-*.AppImage
            ```

            ## Updating

            If [appimageupdatetool](https://github.com/AppImageCommunity/AppImageUpdate)
            is installed, the AppImage can update itself:

            ```
            appimageupdatetool dosemu2-*.AppImage
            ```
          allowUpdates: true
          # The asset filename carries the dosemu2 version, so a new
          # build never overwrites the previous one by name. Clear the
          # release first, or old AppImages pile up and anything picking
          # an asset by position (An/AM's `head -1`) gets a stale one.
          # Safe only because this one job uploads every arch at once,
          # and because the step above has already archived this build
          # under its own tag — nothing is lost by clearing here.
          removeArtifacts: true
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
