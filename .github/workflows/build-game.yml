name: Build game AppImage

# Builds a ready-to-run AppImage for each DOS game recipe under
# games/recipes/. Each recipe declares the upstream archive URL, the
# entry .exe, and a stage() function that produces the directory mkdexe2
# packages. See games/README.md for the policy on what's redistributable
# and how to add a new recipe.
#
# Releases are published per-game to fixed tags (e.g. game-wolf3d-shareware)
# with makeLatest=false so the dosemu2 release in appimage.yml retains
# the "Latest" badge on the releases page.

on:
  push:
    branches: [trunk]
    paths:
      - 'games/**'
      - '.github/workflows/build-game.yml'
  pull_request:
    branches: [trunk]
    paths:
      - 'games/**'
      - '.github/workflows/build-game.yml'
  workflow_dispatch:
  # Monthly rebuild so the games track the current mkdexe2 + appimagetool.
  schedule:
    - cron: '15 7 1 * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # When adding a new recipe, list its short name (the part before
        # .sh in games/recipes/) here.
        game:
          - wolf3d-shareware
        os:
          # x86_64 only. DOS games are 16-bit x86 binaries by
          # definition, and an arm64 wrapper would only run them
          # through dosemu2's simx86 JIT (emulation on emulation).
          # Add ubuntu-24.04-arm back if someone files a request.
          - ubuntu-24.04
    env:
      DOCKER_BUILD: "1"
      WORKSPACE: ${{ github.workspace }}
      GAME: ${{ matrix.game }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull linuxdeploy builder image
        run: docker pull andy5995/linuxdeploy:v3-jammy

      - name: Build game AppImage
        run: docker compose run --rm build-game

      - name: Resolve metadata
        run: |
          ARCH=$(uname -m)
          {
            echo "ARCH=${ARCH}"
            echo "GAME_NAME=$(cat out/GAME_NAME)"
            echo "GAME_TAG=$(cat out/GAME_TAG)"
            echo "GAME_DISPLAY=$(cat out/GAME_DISPLAY)"
            echo "GAME_APPIMAGE=$(cat out/GAME_APPIMAGE)"
          } >> "$GITHUB_ENV"

      - name: Compose release body
        run: |
          {
            echo "Ready-to-run AppImage of **${GAME_DISPLAY}**, packaged with"
            echo "[mkdexe2](https://github.com/dosemu2/mkdexe2) on top of the"
            echo "dosemu2 host runtime."
            echo
            echo "## Run it"
            echo
            echo '```'
            echo "chmod +x ${GAME_APPIMAGE}"
            echo "./${GAME_APPIMAGE}"
            echo '```'
            echo
            echo "Requires dosemu2 on \`PATH\` as \`dosemu\`. The easiest way is"
            echo "to symlink the [dosemu2 AppImage](../../releases/latest) from"
            echo "this same repo:"
            echo
            echo '```'
            echo 'ln -sf ~/Downloads/dosemu2-*-x86_64.AppImage ~/.local/bin/dosemu'
            echo '```'
            echo
            echo "## Licensing"
            echo
            cat out/GAME_LICENSE
          } > release-body.md

      - name: Upload AppImage artifact (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.GAME_NAME }}-AppImage-${{ env.ARCH }}
          path: ./out/org.dosemu2.*
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.GAME_TAG }}
          name: ${{ env.GAME_DISPLAY }}
          artifacts: "./out/org.dosemu2.*"
          bodyFile: release-body.md
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          omitBodyDuringUpdate: false
          omitNameDuringUpdate: false
          # Game releases never claim "Latest" — that belongs to the
          # dosemu2 release.
          makeLatest: false
          token: ${{ secrets.GITHUB_TOKEN }}
