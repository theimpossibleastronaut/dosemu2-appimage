name: dosemu2 docker image

on:
  push:
    branches: [trunk]
    paths:
      - 'Dockerfile'
      - 'Dockerfile.git'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
  schedule:
    # Monthly rebuild so the PPA image picks up upstream package updates
    # and the git image picks up dosemu2 devel-branch changes.
    - cron: '30 11 20 * *'

concurrency:
  # Coalesce same-branch pushes, but do NOT cancel an in-flight Arch build
  # (Dockerfile.git takes 30–60 min — cancel-in-progress would waste runner
  # time and leave caches half-warm).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Full Docker Hub image path (namespace/repo). Defined once so changing
  # accounts later is a single edit.
  IMAGE: andy5995/dosemu2

jobs:
  build:
    runs-on: ubuntu-24.04
    name: build-${{ matrix.variant }}
    strategy:
      # One variant failing shouldn't kill the other — they're independent.
      fail-fast: false
      matrix:
        include:
          - variant: ppa
            dockerfile: Dockerfile
          - variant: git
            dockerfile: Dockerfile.git
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ matrix.variant }}
          # gha cache speeds up rebuilds triggered by Dockerfile edits. Scoped
          # per variant so PPA and git caches don't stomp each other.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
          # Force fresh source pulls on the monthly cron and on manual
          # workflow_dispatch — otherwise `git clone dosemu2` and the PPA's
          # `apt-get install dosemu2` get cached and never see upstream
          # updates. Push events still use cache.
          no-cache: ${{ github.event_name != 'push' }}
