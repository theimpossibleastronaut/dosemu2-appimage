services:
  build:
    # HOSTUID/HOSTGID are auto-detected by the v3-jammy entrypoint from
    # the bind-mounted workspace owner. Export them on the host only if
    # you need to override the default (e.g. CI matrix runs).
    environment:
      HOSTUID: ${HOSTUID:-}
      HOSTGID: ${HOSTGID:-}
      # VERSION is auto-detected from the installed dosemu2 deb inside the
      # container. Override by exporting VERSION before `docker compose run`.
      VERSION: "${VERSION:-}"
      WORKSPACE: ${WORKSPACE:-/workspace}
      DOCKER_BUILD: "1"
      GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER:-theimpossibleastronaut}
    image: andy5995/linuxdeploy:v3-jammy
    volumes:
      - ${PWD}:${WORKSPACE:-/workspace}
    working_dir: ${WORKSPACE:-/workspace}
    # Absolute path or relative to workspace
    command: "${SCRIPT:-./build-appimage.sh}"
